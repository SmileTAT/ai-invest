          { kind: '实践：', text: '复盘一轮历史牛熊，写出当时估值 / 情绪 / 政策的演变时间线' }

      { id: 'po3', code: 'C-02', name: '组合管理与仓位控制', enName: 'Portfolio & Position Sizing',
        what: '把单个「好判断」组装成能活下来的整体：确定持仓数量与集中度、单只股票的仓位上限、买入卖出的分批纪律、现金的角色，以及事先写好的应对预案（下跌加仓线 / 逻辑破坏卖出线）。',
        why: '投资的第一原则是不要亏钱——指的是不可挽回的永久性损失。再高的胜率，一次满仓押错就能出局。组合管理的意义是让你「判断对时赚得足够，判断错时输得起」，长期留在牌桌上。',
        how: ['写下自己的仓位规则：单只上限、行业上限、现金下限，规则先于个案',
              '按确定性分配仓位：理解越深、赔率越好的机会仓位越重，而不是平均分配',
              '为每个持仓写「卖出预案」：什么情况说明逻辑被破坏、什么情况只是价格波动',
              '每季度做一次组合体检：集中度、相关性、每个持仓的逻辑是否仍然成立'],
        checks: [
          { kind: '自测：', text: '我有一份成文的仓位规则，且能解释每条规则背后的理由' },
          { kind: '自测：', text: '我能区分「价格下跌」与「逻辑破坏」，并各举一个自己组合里的例子' },
          { kind: '实践：', text: '连续 4 个季度执行组合体检并留下书面记录' },
          { kind: '实践：', text: '完整经历一次按预案执行的卖出（无论止盈或认错），且复盘确认执行未变形' }
        ] }
    ],
    books: [
      { id: 'b31', title: '穷查理宝典', author: '查理·芒格', note: '多元思维模型与误判心理学', reading: true },
      { id: 'b32', title: '投资最重要的事', author: '霍华德·马克斯', note: '风险、周期与第二层思维', reading: false },
      { id: 'b33', title: '周期', author: '霍华德·马克斯', note: '钟摆与位置感', reading: false },
      { id: 'b34', title: '怎样选择成长股', author: '菲利普·费雪', note: '定性研究与闲聊法', reading: false }
    ]
  }
];

const STORE_KEY = 'vi-path-checks-v1';
let checks = {};
try { checks = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) {}
let expanded = { r1: true };

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(checks)); } catch (e) {}
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  let done = 0, total = 0;
  const stageStats = [];
  const stageHtml = DATA.map(st => {
    let stDone = 0, stTotal = 0;
    const abilitiesHtml = st.abilities.map(ab => {
      const abChecks = ab.checks.map((c, i) => {
        const id = ab.id + '-c' + i;
        const on = !!checks[id];
        stTotal++; total++;
        if (on) { stDone++; done++; }
        return `
          <div class="check" data-check="${id}">
            <span class="box" style="background:${on ? '#1c1a17' : 'transparent'}">${on ? '✓' : ''}</span>
            <span class="txt" style="color:${on ? '#8a8478' : '#33302a'};text-decoration:${on ? 'line-through' : 'none'}">
              <span class="kind">${esc(c.kind)}</span>${esc(c.text)}</span>
          </div>`;
      });
      const abDone = ab.checks.filter((c, i) => checks[ab.id + '-c' + i]).length;
      const isOpen = !!expanded[ab.id];
      const body = !isOpen ? '' : `
        <div class="ab-body">
          <div class="grid2">
            <div><h4 class="tag">WHAT · 是什么</h4><p>${esc(ab.what)}</p></div>
            <div><h4 class="tag">WHY · 为什么</h4><p>${esc(ab.why)}</p></div>
          </div>
          <div>
            <h4 class="tag">HOW · 如何构建</h4>
            <ol>${ab.how.map(h => `<li>${esc(h)}</li>`).join('')}</ol>
          </div>
          <div class="validate">
            <h4 class="tag" style="margin-bottom:14px">VALIDATE · 如何验证（勾选自测）</h4>
            <div class="checks">${abChecks.join('')}</div>
          </div>
        </div>`;
      return `
        <article class="ability">
          <div class="ab-head" data-expand="${ab.id}">
            <span class="ab-code">${esc(ab.code)}</span>
            <div class="ab-title"><span class="ab-name">${esc(ab.name)}</span><span class="ab-en">${esc(ab.enName)}</span></div>
            <span class="ab-done">${abDone}/${ab.checks.length}</span>
            <span class="chev" style="transform:rotate(${isOpen ? 180 : 0}deg)">▾</span>
          </div>
          ${body}
        </article>`;
    });
    const booksHtml = st.books.map(b => {
      const on = !!checks[b.id];
      stTotal++; total++;
      if (on) { stDone++; done++; }
      return `
        <div class="book" data-check="${b.id}">
          <span class="box" style="background:${on ? '#1c1a17' : 'transparent'}">${on ? '✓' : ''}</span>
          <span class="title" style="color:${on ? '#8a8478' : '#1c1a17'}">${esc(b.title)}</span>
          <span class="author">${esc(b.author)}</span>
          ${b.reading ? '<span class="badge-reading">在读</span>' : ''}
          <span class="note">${esc(b.note)}</span>
        </div>`;
    });
    stageStats.push({ num: st.num, name: st.name, label: stDone + ' / ' + stTotal + ' 项完成' });
    return `
      <section class="stage">
        <div class="stage-head">
          <span class="big">${esc(st.num)}</span>
          <div><h2>${esc(st.name)}</h2><p class="en">${esc(st.en)}</p></div>
        </div>
        <p class="stage-intro">${esc(st.intro)}</p>
        <div class="abilities">${abilitiesHtml.join('')}</div>
        <div class="books">
          <h3><span class="zh">本阶段书单</span><span class="en">READING LIST</span></h3>
          <div class="booklist">${booksHtml.join('')}</div>
        </div>
      </section>`;
  });

  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('app').innerHTML = `
    <header class="hero">
      <div class="kicker"><span>PERSONAL LEARNING MAP</span><span>VALUE INVESTING · 价值投资</span></div>
      <h1>价值投资<br>学习之路</h1>
      <div class="lede">
        <p>买股票就是买公司。这份学习地图把这条路分为三个阶段、七项核心能力——每项能力回答四个问题：<strong>是什么（What）、为什么（Why）、如何构建（How）、如何验证（Validate）</strong>。勾选进度会自动保存，随时回来续上。</p>
        <div class="progress">
          <div class="label"><span>总进度 PROGRESS</span><span>${done} / ${total}</span></div>
          <div class="bar"><div style="width:${pct}%"></div></div>
        </div>
      </div>
      <nav class="stages">
        ${stageStats.map(s => `<div class="cell"><span class="num">STAGE ${esc(s.num)}</span><span class="name">${esc(s.name)}</span><span class="sub">${esc(s.label)}</span></div>`).join('')}
      </nav>
    </header>
    ${stageHtml.join('')}
    <footer>
      <p class="quote">「用买下整家公司的心态，去买它的一部分。」</p>
      <p class="meta">进度保存在本机 · 随时勾选更新</p>
    </footer>`;
}

document.getElementById('app').addEventListener('click', e => {
  const check = e.target.closest('[data-check]');
  if (check) {
    const id = check.dataset.check;
    checks[id] = !checks[id];
    save();
    render();
    return;
  }
  const head = e.target.closest('[data-expand]');
  if (head) {
    const id = head.dataset.expand;
    expanded[id] = !expanded[id];
    render();
  }
});

render();
</script>
</body>
</html>
